<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Página de inicio</title>
</head>
<body>
	<header th:replace="comun/Cabecera :: cab"></header>
	<div id="peticion">
		<fieldset id="petPend">
			<legend class="peticiones">Peticiones pendientes</legend>
			 <span th:forEach="pet : ${peticionVacaciones}" th:if="${petVacaciones != null and #lists.isEmpty(petVacaciones)}">No hay peticiones pendientes.</span>
			<section th:unless="${petVacaciones != null and #lists.isEmpty(petVacaciones)}">
				<ul>
					<li>IdPeticion: <span th:text="pet.idPeticion"></span></li>
					<li>Año: <span th:text="pet.año"></span></li>	
					<li>Comentario: <span th:text="pet.comentario"></span></li>	
				</ul>
			</section>
		</fieldset>
		<fieldset id="petAprob">
			<legend class="peticiones">Peticiones aprobadas</legend>
			<span th:if="${petVacaciones != null and #lists.isEmpty(petVacaciones)}">No hay peticiones aprobadas.</span>
			<section th:unless="${petVacaciones != null and #lists.isEmpty(petVacaciones)}">
				<ul>
					<li>IdPeticion: <span th:text="pet.idPeticion"></span></li>
					<li>Año: <span th:text="pet.año"></span></li>	
					<li>Comentario: <span th:text="pet.comentario"></span></li>	
				</ul>
			</section>
		</fieldset>
		<fieldset id="petRechazadas">
			<legend class="peticiones">Peticiones rechazadas</legend>
			<span th:if="${petVacaciones != null and #lists.isEmpty(petVacaciones)}">No hay peticiones rechazadas.</span>
			<section th:unless="${petVacaciones != null and #lists.isEmpty(petVacaciones)}">
				<ul>
					<li>IdPeticion: <span th:text="pet.idPeticion"></span></li>
					<li>Año: <span th:text="pet.año"></span></li>	
					<li>Comentario: <span th:text="pet.comentario"></span></li>	
				</ul>
			</section>
		</fieldset>
	</div>
	<script src="js/Menu.js"></script>
</body>
</html>
