<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Ver perfil</title>
    <link rel="stylesheet" href="../static/css/Cabecera.css" th:href="@{/css/Cabecera.css}"/>
    <link rel="stylesheet" href="../static/css/Perfil.css" th:href="@{/css/Perfil.css}">
</head>
<body>
    <header th:replace="~{comun/Cabecera :: cab}"></header>
    <div class="perfil">
            <div class="seccion">
                <h3>Mis Datos</h3>
                <p>Nombre: <span th:text="${session.usuario.nombre}"></span></p>
                <p>Apellidos: <span th:text="${session.usuario.apellidos}"></span></p>
                <p>Correo: <span th:text="${session.usuario.email}"></span></p>
                <p>Clave: <span th:text="${session.usuario.clave}"></span></p>
                <p>Rol: <span th:text="${session.usuario.tipoUsuario}"></span></p>
                <p>Centro: <span th:text="${session.usuario.centro}"></span></p>
				<input type="button" value="Actualizar datos">
				<input type="button" value="Volver a la página de inicio" th:onclick="@{/paginaInicio}">
			</div>
		</div>
		
	<script type="text/javascript" src="js/Menu.js"></script>				
</body>
</html>
