<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title></title>
</head>
<body>
	<table th:fragment="list" id="lista">
		<thead th:if="${!#lists.isEmpty(peticiones)}">
			<th>Peticiones</th>
			<th>Fecha de inicio</th>
			<th>Fecha de fin</th>
			<th>Año</th>
			<th>Comentario</th>
			<th>Estado</th>
			<th>Usuario</th>
		</thead>
		</tbody>	
			<tr th:each="pet, num : ${peticiones}">
				<td>Petición <span th:text="${num.count}"></span></td>
				<td th:text="${pet.fechaInicio}"></td>
				<td th:text="${pet.fechaFin}"></td>
				<td th:text="${pet.año}"></td>
				<td th:if="${pet.comentario != null}"><span th:text="${pet.comentario}"></span></td>
				<td th:unless="${pet.comentario != null}">---------------</td>
				<td th:text="${pet.estado}"></td>
				<td th:text="${pet.usuario.nombre  + ' ' + pet.usuario.apellidos}"></td>
			</tr>
		</tbody>
	</table>
	<div th:if="${session.usuario.tipoUsuario.name().equals('GESTOR') and !#lists.isEmpty(peticiones)}" th:fragment="boton">
		<input type="submit" value="Exportar a Excel" id="btnExportar" onclick="exportarLista('excel')">
<!-- 		<div id="archivos"> -->
<!-- 			<ul>  -->
<!-- 				<li onclick="exportarLista('word')">Word</li> -->
<!-- 				<li >Excel</li> -->
<!-- 				<li onclick="exportarLista('txt')">Bloc de notas</li> -->
<!-- 				<li onclick="exportarLista('odt')">Libre Office</li>	 -->
<!-- 			</ul> -->
<!-- 		</div> -->
	</div>	
	<script th:if="${session.usuario.tipoUsuario.name().equals('GESTOR') and !#lists.isEmpty(peticiones)}" type="text/javascript" th:src="@{/js/Exportar.js}" th:fragment="export"></script>
</body>
</html>
