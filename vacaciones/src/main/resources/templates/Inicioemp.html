<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<head th:replace="~{comun/Cabecera :: icono}"></head>
	<link rel="stylesheet" href="../static/css/Inicio.css" th:href="@{/css/Inicio.css}">
	<title>Página de inicio</title>
</head>
<body>
	<header th:replace="~{comun/Cabecera :: cab}"></header>
	<dialog th:if="${session.usuario.claveReseteada == true}">		
		<form action="@{/reseteoContraseña}" method="post">
					<div class="campo">
				        <label for="txtclave">Introduzca tu contraseña actual:</label>
				        <input type="password" id="txtclave" required>
				        <img alt="ojo" src="/imagenes/ojo_cerrado.png" id="imagen"/>
				    </div>
					<div class="campo">
				        <label for="txtclave1">Introduzca la nueva contraseña:</label>
				        <input type="password" id="txtclave1" required>
				        <img alt="ojo" src="/imagenes/ojo_cerrado.png" id="imagen1"/>
				    </div>			    
				     <div class="campo">
				        <label for="txtclave2">Repita la nueva contraseña:</label>
				        <input type="password" id="txtclave2" name="passwordrepe" required>
				        <img alt="ojo" src="/imagenes/ojo_cerrado.png" id="imagen2"/>
				    </div>
				    <div class="error" th:if="${errorR}">
			            <span th:text="${errorR}"></span>
			        </div>		        
					<input type="submit" value="Cambiar contraseña">
				</form>
			</dialog>
	<div id="peticion">
		<fieldset>
			<legend>Peticiones pendientes</legend>
			<span th:if="${peticionVacacionesPendientes == null or #lists.isEmpty(peticionVacacionesPendientes)}">No hay peticiones pendientes.</span>
			<div th:each="pet : ${peticionVacacionesPendientes}">
				<a th:href="@{/peticiones(id=${pet.idPeticion})}" id="petPend">
					<ul>
						<li>Año: <span th:text="${pet.año}"></span></li>
						<li th:if="${pet.comentario != null}">Comentario: <span th:text="${pet.comentario}"></span></li>
					</ul>
				</a>
			</div>
		</fieldset>
		<fieldset>
			<legend>Peticiones aprobadas</legend>			
			<span th:if="${peticionVacacionesAprobadas == null or #lists.isEmpty(peticionVacacionesAprobadas)}">No hay peticiones aprobadas.</span>
			<div th:each="pet : ${peticionVacacionesAprobadas}">
				<a th:href="@{/peticionesAp(id=${pet.idPeticion})}" id="petAprob">
					<ul>
						<li>Año: <span th:text="${pet.año}"></span></li>
						<li th:if="${pet.comentario != null}">Comentario: <span th:text="${pet.comentario}"></span></li>
					</ul>
				</a>
			</div>
		</fieldset>
		<fieldset>
			<legend>Peticiones rechazadas</legend>
			<span th:if="${peticionVacacionesRechazadas == null or #lists.isEmpty(peticionVacacionesRechazadas)}">No hay peticiones rechazadas.</span>
			<div th:each="pet : ${peticionVacacionesRechazadas}">
				<a th:href="@{/peticionesRechaz(id=${pet.idPeticion})}" id="petRechazadas">
					<ul>
						<li>Año: <span th:text="${pet.año}"></span></li>
						<li th:if="${pet.comentario != null}">Comentario: <span th:text="${pet.comentario}"></span></li>
					</ul>
				</a>
			</div>
		</fieldset>
	</div>
	<script th:src="@{/js/Menu.js}"></script>
<script th:if="${errorR !=null and session.usuario.claveReseteada == true}" th:inline="javascript">
    		window.addEventListener("load", function() {
	        const dialogo = document.getElementById("Actualizarcon");
	
	        if (dialogo) {
	            dialogo.showModal();
	        }
	    });
	</script>
	<script th:src="@{/js/Actualizarcon.js}"></script>
</body>
</html>
